<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Dining Concierge - restaurant suggestions delivered to your inbox.">
    <title>Dining Concierge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="./assets/css/chat.css" rel="stylesheet">

    <!-- api gateway generated sdk -->
    <script src="./assets/js/sdk/lib/axios/dist/axios.standalone.js"></script>
    <script src="./assets/js/sdk/lib/CryptoJS/rollups/sha256.js"></script>
    <script src="./assets/js/sdk/lib/CryptoJS/components/hmac.js"></script>
    <script src="./assets/js/sdk/lib/CryptoJS/components/enc-base64.js"></script>
    <script src="./assets/js/sdk/lib/url-template/url-template.js"></script>
    <script src="./assets/js/sdk/lib/apiGatewayCore/sigV4Client.js"></script>
    <script src="./assets/js/sdk/lib/apiGatewayCore/apiGatewayClient.js"></script>
    <script src="./assets/js/sdk/lib/apiGatewayCore/simpleHttpClient.js"></script>
    <script src="./assets/js/sdk/lib/apiGatewayCore/utils.js"></script>
    <script src="./assets/js/sdk/apigClient.js"></script>
  </head>

  <body>
    <main class="app">
      <section class="chat" aria-label="Dining Concierge chat">
        <header class="chat-header">
          <div class="bot-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
          </div>
          <div class="chat-title">
            <h1>Dining Concierge</h1>
            <p><span class="status-dot"></span>Online · suggestions sent by email</p>
          </div>
        </header>

        <div class="messages" id="messages" role="log" aria-live="polite"></div>

        <div class="suggestions" id="suggestions">
          <button type="button" class="chip">Hi there!</button>
          <button type="button" class="chip">I need restaurant suggestions</button>
          <button type="button" class="chip">Find me Japanese food in Manhattan</button>
        </div>

        <form class="composer" id="composer" autocomplete="off">
          <textarea id="message-input" class="message-input" rows="1" placeholder="Type a message…" aria-label="Message"></textarea>
          <button type="submit" class="send-btn" id="send-btn" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
          </button>
        </form>
      </section>
    </main>

    <script>
      var sdk = apigClientFactory.newClient({});
    </script>
    <script src="./assets/js/chat.js"></script>
  </body>
</html>
